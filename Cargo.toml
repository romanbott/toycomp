[workspace]
members = [
    "crates/toycomp-syntax",
    "crates/toycomp-lang",
    "crates/toycomp-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "fat"
debug = true

# The LALR/DFA generators run inside build scripts. Keep them optimized even
# for `cargo test` / `cargo build` in the dev profile.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
